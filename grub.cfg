insmod loadenv

# --- boot_once gate ---
if [ -f ($root)/yorbo/grubenv ]; then
    load_env -f ($root)/yorbo/grubenv
else
    echo "grubenv not found at ($root)/yorbo/grubenv"
    exit
fi

if [ "$boot_once" != "true" ]; then
    echo "boot_once != true, exiting to firmware"
    exit
fi

set boot_once=true
save_env -f ($root)/yorbo/grubenv boot_once

loopback vloop ($root)/ventoy/caged_vtoy.img

set root=(vloop,2)
set prefix=(vloop,2)/grub

set vtoy_dev=vloop
set vtoy_iso_part=($vtoy_dev,1)
set vtoy_efi_part=($vtoy_dev,2)

configfile $prefix/grub.cfg